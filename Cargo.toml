[workspace]
resolver = "3"
members = ["md500-core", "md500", "md500-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/ragb/md-500-access-rs"

[workspace.dependencies]
md500-core = { path = "md500-core" }
# Shared foundation crates, pinned to the published kit (same tag the rest of the
# family uses). For local development against an unreleased kit, point these at
# `path = "../midi-access-kit/<crate>"`.
midi-access-core = { git = "https://github.com/ragb/midi-access-kit", tag = "v0.6.0" }
midi-access-cli = { git = "https://github.com/ragb/midi-access-kit", tag = "v0.6.0" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_norway = "0.9"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
tsify = { version = "0.5", features = ["js"] }
schemars = "1"

[profile.release]
lto = "thin"
strip = true
